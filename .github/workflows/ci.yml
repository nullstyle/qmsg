name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.lane }}
    runs-on: ${{ matrix.os }}
    # A hung test binary must fail the job, not burn a runner for the
    # 6-hour default. The QUIC lane drives real loopback UDP handshakes;
    # sized with headroom over measured runs.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: test (unit + QUIC transport)
            os: ubuntu-latest
            step: zig build test --summary all
          - lane: test (unit + QUIC transport, macOS)
            os: macos-latest
            step: zig build test --summary all
          - lane: examples
            os: ubuntu-latest
            step: zig build examples --summary all
          - lane: capnp codec (-Dcapnp=true)
            os: ubuntu-latest
            step: zig build -Dcapnp=true capnp-test --summary all
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.17

      - uses: ./.github/actions/setup-zig

      - name: Run lane
        shell: bash
        run: ${{ matrix.step }}

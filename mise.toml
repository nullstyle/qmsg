[tools]
# The tagged Zig 0.17.0 release: the floor of the quic-zig tarball
# pin (v0.24.1), whose build.zig refuses every 0.17.0-dev build.
zig = "0.17.0"

[env]
ZIG_GLOBAL_CACHE_DIR = "{{config_root}}/.zig-global-cache"

[tasks.test]
description = "Run the qmsg test suite (unit + QUIC transport)"
run = "zig build test"

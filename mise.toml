[tools]
# Zig master pin verified for this release. quic-zig is now a
# tarball pin (v0.19.0), whose floor is dev.1683; qmsg is verified
# on the consumer's toolchain (mruby-quic's pin) so the published
# package compiles where it is consumed.
zig = "0.17.0-dev.1786+75044cb04"

[env]
ZIG_GLOBAL_CACHE_DIR = "{{config_root}}/.zig-global-cache"

[tasks.test]
description = "Run the qmsg test suite (unit + QUIC transport)"
run = "zig build test"
